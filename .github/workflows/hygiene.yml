# Shared "shift-left" hygiene gate. Reusable across the suite so shift-left is a real,
# reviewable artifact — not a slogan. Call it from a repo with:
#
#   jobs:
#     hygiene:
#       uses: technika11y/.github/.github/workflows/hygiene.yml@main
#
name: hygiene

on:
  workflow_call:

# Least privilege: this reusable gate only needs to read the repo.
permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # NOTE: gitleaks-action may request a (free) GITLEAKS_LICENSE for organizations.
      # If the job fails asking for one, register at gitleaks.io and add it as an org secret,
      # or replace this step with the gitleaks binary run.
      - name: secret scan (gitleaks, license-free)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o gl.tgz
          tar -xzf gl.tgz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1
